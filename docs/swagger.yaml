        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_obutora_internal_model.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_obutora_internal_model.AppError'
      summary: 製品情報取得
      tags:
      - products
    put:
      consumes:
      - application/json
      description: 指定されたIDの製品情報を更新します
      parameters:
      - description: 製品ID
        in: path
        name: id
        required: true
        type: integer
      - description: 製品情報
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/github_com_obutora_internal_api_v1_dto.ProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_obutora_internal_api_v1_dto.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_obutora_internal_model.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_obutora_internal_model.AppError'
      summary: 製品更新
      tags:
      - products
